services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mantis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-mantisbase}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mantis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mantisbase:
    image: allankoech/mantisbase:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7070:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/mb/data
      - ./public:/mb/public:ro
      - ../migrations:/mb/migrations:ro
      - ../07-scripting/scripts:/mb/scripts:ro
    environment:
      MB_JWT_SECRET: ${MB_JWT_SECRET:?MB_JWT_SECRET must be set}
      MB_DB: postgresql
      MB_DB_URL: ${MB_DB_URL:?MB_DB_URL must be set}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  pgdata:
