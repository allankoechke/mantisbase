[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mantisbase"
# Base version is project(MantisBase VERSION ...) in the repo CMakeLists.txt.
# CI release tags append a PEP 440 pre-release marker. See version_provider.py.
dynamic = ["version"]
description = "Python bindings for mantisbase – Flask-style HTTP server backed by a C++ engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Allan Koech" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
# version_provider.py is source. _mb_version.txt is generated at sdist time
# (see generate below) and is gitignored, so it must be named here.
# mantisbase.pyi is installed beside the extension by CMakeLists.txt.
sdist.include = ["version_provider.py", "_mb_version.txt", "mantisbase.pyi"]

[[tool.dynamic-metadata]]
provider = {path = ".", module = "version_provider"}
field = "version"

[[tool.scikit-build.generate]]
path = "_mb_version.txt"
location = "source"
template = "${version}\n"
