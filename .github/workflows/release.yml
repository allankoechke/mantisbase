name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-matrix.yml

  package-dev-zip:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          # package-dev.cmake copies 3rd-party headers straight from the source tree.
          submodules: recursive
          fetch-depth: 1

      - name: Download library artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mantisbase_${{ github.ref_name }}_*-lib
          path: ./dev-staging/
          merge-multiple: true

      - name: Assemble dev package
        run: |
          cmake -P cmake/package-dev.cmake \
            -DMB_SOURCE_DIR=${{ github.workspace }} \
            -DMB_VERSION_TAG=${{ github.ref_name }} \
            -DMB_LIB_STAGING_DIR=${{ github.workspace }}/dev-staging \
            -DMB_OUTPUT_DIR=${{ github.workspace }}/dev-package

      - name: Create dev zip
        run: |
          cd dev-package && zip -r ../mantisbase_${{ github.ref_name }}-dev.zip lib/ include/ include-linux/ include-windows/ VERSION README.md

      - name: Upload dev zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}-dev.zip
          path: mantisbase_${{ github.ref_name }}-dev.zip

  release:
    needs: [build, package-dev-zip]
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mantisbase_${{ github.ref_name }}*.zip
          path: ./artifacts
          merge-multiple: true

      - name: Show artifact contents
        run: ls -lh ./artifacts/

      - name: Classify tag
        id: meta
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            channel=$(echo "$version" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-z]+)\.[0-9]+$/\1/')
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: ./artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ github.ref_name }}
      prerelease: ${{ needs.release.outputs.prerelease }}
      channel: ${{ needs.release.outputs.channel }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
