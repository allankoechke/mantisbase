name: Build matrix

on:
  workflow_call: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: linux-x86_64
            arch: x86_64
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: windows-x86_64
            arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies on Ubuntu
        if: matrix.os != 'windows-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev uuid-dev

      - name: Install MinGW
        if: matrix.os == 'windows-latest'
        run: |
          choco install mingw --no-progress

      - name: Add MinGW to PATH
        if: matrix.os == 'windows-latest'
        run: |
          echo "C:\ProgramData\mingw64\mingw64\bin" >> $GITHUB_PATH

      - name: Verify MinGW installation
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $mingwPath = "C:\ProgramData\mingw64\mingw64\bin"
          if (Test-Path "$mingwPath\gcc.exe") {
            Write-Host "✓ GCC found at $mingwPath\gcc.exe"
          } else {
            Write-Host "✗ GCC not found at $mingwPath\gcc.exe"
            Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "gcc.exe" | Select-Object -First 1 FullName
          }
          if (Test-Path "$mingwPath\mingw32-make.exe") {
            Write-Host "✓ Make found at $mingwPath\mingw32-make.exe"
          } else {
            Write-Host "✗ Make not found, searching..."
            Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "mingw32-make.exe" | Select-Object -First 1 FullName
          }

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Windows-latest)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          $makePath = Join-Path $mingwBin "mingw32-make.exe"

          # Check if make exists, if not try alternative locations
          if (-not (Test-Path $makePath)) {
            $makePath = "C:\mingw64\bin\mingw32-make.exe"
            if (-not (Test-Path $makePath)) {
              # Try to find it
              $found = Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "mingw32-make.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $makePath = $found.FullName
              }
            }
          }

          Write-Host "Using make at: $makePath"

          cmake -B ${{ steps.strings.outputs.build-output-dir }} `
            -G "MinGW Makefiles" `
            -DCMAKE_CXX_COMPILER="$mingwBin\g++.exe" `
            -DCMAKE_C_COMPILER="$mingwBin\gcc.exe" `
            -DCMAKE_MAKE_PROGRAM="$makePath" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DMB_BUILD_TESTS=true `
            -DMB_BUILD_DOCS=OFF `
            -DMB_BUILD_SHARED_LIB=ON `
            -S ${{ github.workspace }}

      - name: Configure CMake (Linux)
        if: matrix.os != 'windows-latest'
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMB_BUILD_TESTS=ON \
            -DMB_BUILD_DOCS=OFF \
            -DMB_BUILD_SHARED_LIB=ON \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Zip the build output (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os != 'windows-latest'
        run: |
          cd ${{ github.workspace }}/build/bin
          rm -f mantisbase_tests
          mkdir -p zip
          zip -r zip/mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip mantisbase*

      - name: Zip the build output (Windows-latest)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          del "${{ steps.strings.outputs.build-output-dir }}\bin\mantisbase_tests.exe"
          $BinPath = "${{ steps.strings.outputs.build-output-dir }}\bin"
          $ZipPath = "$BinPath\zip"
          $ZipFile = "$ZipPath\mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip"

          New-Item -ItemType Directory -Force -Path $ZipPath | Out-Null
          Compress-Archive -Path "$BinPath\mantisbase*.exe" -DestinationPath $ZipFile -Force

      - name: Upload zipped artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip
          path: |
            ${{ github.workspace }}/build/bin/zip/mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip

      - name: Stage library files (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p lib-staging/lib/linux/static
          mkdir -p lib-staging/lib/linux/shared
          mkdir -p lib-staging/generated-include/mantisbase
          cp ${{ steps.strings.outputs.build-output-dir }}/lib/libmantisbase.a lib-staging/lib/linux/static/
          cp ${{ steps.strings.outputs.build-output-dir }}/lib/libmantisbase.so lib-staging/lib/linux/shared/
          cp ${{ steps.strings.outputs.build-output-dir }}/include/mantisbase/config.hpp lib-staging/generated-include/mantisbase/config.hpp

      - name: Upload library artifact (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_linux-lib
          path: lib-staging/

      - name: Stage library files (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "lib-staging\lib\windows\static" | Out-Null
          New-Item -ItemType Directory -Force -Path "lib-staging\lib\windows\shared" | Out-Null
          Copy-Item "build\lib\libmantisbase.a" -Destination "lib-staging\lib\windows\static\"
          Copy-Item "build\bin\libmantisbase.dll" -Destination "lib-staging\lib\windows\shared\"
          Copy-Item "build\lib\libmantisbase.dll.a" -Destination "lib-staging\lib\windows\shared\"

      - name: Upload library artifact (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_windows-lib
          path: lib-staging\