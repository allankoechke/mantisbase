name: Build matrix

on:
  workflow_call: {}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: linux-x86_64
            lib_platform: linux
            arch: x86_64
            arch_label: x86-64
            pkg_arch: x86
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
            platform: linux-aarch64
            lib_platform: linux
            arch: aarch64
            arch_label: aarch64
            pkg_arch: arm
          - os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: windows-x86_64
            lib_platform: windows
            arch: x86_64
            arch_label: x86-64
            pkg_arch: x86
          # NOTE: macos-15-intel is GitHub's last x86-64 macOS image and is on
          # the deprecation path — if it disappears, drop this entry (ARM covers macOS).
          - os: macos-15-intel
            c_compiler: clang
            cpp_compiler: clang++
            platform: macos-x86_64
            lib_platform: macos
            arch: x86_64
            arch_label: x86-64
            pkg_arch: x86
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: macos-aarch64
            lib_platform: macos
            arch: aarch64
            arch_label: aarch64
            pkg_arch: arm
          # Windows on ARM builds with llvm-mingw (GNU-compatible Clang for
          # aarch64-windows); the choco `mingw` package is x86-64 only.
          - os: windows-11-arm
            c_compiler: clang
            cpp_compiler: clang++
            platform: windows-aarch64
            lib_platform: windows
            arch: aarch64
            arch_label: aarch64
            pkg_arch: arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies (Linux)
        if: matrix.lib_platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev uuid-dev

      - name: Install dependencies (macOS)
        if: matrix.lib_platform == 'macos'
        run: |
          # PostgreSQL backend is enabled on all UNIX (see cmake/add-soci.cmake);
          # brew libpq is keg-only, so expose it for find_package(PostgreSQL).
          # uuid/ is provided by the macOS SDK — no package needed.
          brew install libpq
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libpq)" >> "$GITHUB_ENV"

      - name: Install MinGW (Windows x86-64)
        if: matrix.lib_platform == 'windows' && matrix.arch == 'x86_64'
        run: |
          choco install mingw --no-progress

      - name: Install llvm-mingw (Windows ARM64)
        if: matrix.lib_platform == 'windows' && matrix.arch == 'aarch64'
        run: |
          choco install llvm-mingw ninja --no-progress

      - name: Add MinGW to PATH
        if: matrix.lib_platform == 'windows' && matrix.arch == 'x86_64'
        run: |
          echo "C:\ProgramData\mingw64\mingw64\bin" >> $GITHUB_PATH

      - name: Verify MinGW installation
        if: matrix.lib_platform == 'windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $mingwPath = "C:\ProgramData\mingw64\mingw64\bin"
          if (Test-Path "$mingwPath\gcc.exe") {
            Write-Host "✓ GCC found at $mingwPath\gcc.exe"
          } else {
            Write-Host "✗ GCC not found at $mingwPath\gcc.exe"
            Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "gcc.exe" | Select-Object -First 1 FullName
          }
          if (Test-Path "$mingwPath\mingw32-make.exe") {
            Write-Host "✓ Make found at $mingwPath\mingw32-make.exe"
          } else {
            Write-Host "✗ Make not found, searching..."
            Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "mingw32-make.exe" | Select-Object -First 1 FullName
          }

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Windows x86-64)
        if: matrix.lib_platform == 'windows' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $mingwBin = "C:\ProgramData\mingw64\mingw64\bin"
          $makePath = Join-Path $mingwBin "mingw32-make.exe"

          if (-not (Test-Path $makePath)) {
            $makePath = "C:\mingw64\bin\mingw32-make.exe"
            if (-not (Test-Path $makePath)) {
              $found = Get-ChildItem "C:\ProgramData\mingw64" -Recurse -Filter "mingw32-make.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $makePath = $found.FullName
              }
            }
          }

          Write-Host "Using make at: $makePath"

          cmake -B ${{ steps.strings.outputs.build-output-dir }} `
            -G "MinGW Makefiles" `
            -DCMAKE_CXX_COMPILER="$mingwBin\g++.exe" `
            -DCMAKE_C_COMPILER="$mingwBin\gcc.exe" `
            -DCMAKE_MAKE_PROGRAM="$makePath" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DMB_BUILD_TESTS=true `
            -DMB_BUILD_DOCS=OFF `
            -DMB_BUILD_SHARED_LIB=ON `
            -S ${{ github.workspace }}

      - name: Configure CMake (Windows ARM64)
        if: matrix.lib_platform == 'windows' && matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          # Locate the llvm-mingw cross toolchain (aarch64-windows target).
          $cxx = (Get-Command aarch64-w64-mingw32-clang++.exe -ErrorAction SilentlyContinue)
          if (-not $cxx) {
            $found = Get-ChildItem "C:\ProgramData", $env:ChocolateyInstall -Recurse `
              -Filter "aarch64-w64-mingw32-clang++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) { throw "llvm-mingw toolchain not found after choco install" }
            $cxxPath = $found.FullName
          } else {
            $cxxPath = $cxx.Source
          }
          $ccPath = $cxxPath -replace 'clang\+\+\.exe$', 'clang.exe'
          Write-Host "Using C++ compiler at: $cxxPath"

          cmake -B ${{ steps.strings.outputs.build-output-dir }} `
            -G Ninja `
            -DCMAKE_CXX_COMPILER="$cxxPath" `
            -DCMAKE_C_COMPILER="$ccPath" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DMB_BUILD_TESTS=true `
            -DMB_BUILD_DOCS=OFF `
            -DMB_BUILD_SHARED_LIB=ON `
            -S ${{ github.workspace }}

      - name: Configure CMake (macOS)
        if: matrix.lib_platform == 'macos'
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMB_BUILD_TESTS=ON \
            -DMB_BUILD_DOCS=OFF \
            -DMB_BUILD_SHARED_LIB=ON \
            -S ${{ github.workspace }}

      - name: Configure CMake (Linux)
        if: matrix.lib_platform == 'linux'
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMB_BUILD_TESTS=ON \
            -DMB_BUILD_DOCS=OFF \
            -DMB_BUILD_SHARED_LIB=ON \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release # ${{ matrix.build_type }}

      - name: Check dev headers (Linux/macOS)
        if: matrix.lib_platform == 'linux' || matrix.lib_platform == 'macos'
        shell: bash
        run: |
          # Coalesce the dev-package header tree, then prove every public
          # header compiles against it. Fails the build (incl. PRs) if a
          # public header reaches a third-party header that is not bundled.
          CHECK_DIR="${{ steps.strings.outputs.build-output-dir }}/dev-headers-check"
          cmake --install ${{ steps.strings.outputs.build-output-dir }} \
            --component mb-dev-headers --prefix "$CHECK_DIR"
          pushd ${{ github.workspace }} > /dev/null
          { for f in $(find include/mantisbase \( -name '*.h' -o -name '*.hpp' \)); do
              echo "#include <${f#include/}>"
            done
            echo '#include <mantisbase/config.hpp>'
            echo 'int main() { return 0; }'
          } | sort -u > "$CHECK_DIR/smoke.cpp"
          popd > /dev/null
          g++ -std=c++20 -fsyntax-only "$CHECK_DIR/smoke.cpp" -I"$CHECK_DIR/include"

      - name: Check dev shared lib links soci (Linux)
        if: matrix.lib_platform == 'linux'
        shell: bash
        run: |
          # Linking, not just headers: Database exposes soci types in its
          # public API and devs call soci directly, so prove soci_core symbols
          # resolve from libmantisbase.so alone (no extra soci lib to link).
          # The header check above is -fsyntax-only and would miss this.
          # Link-only on purpose: backend symbols are intentionally NOT
          # exported (see cmake/add-soci.cmake), so this exercises the core
          # surface devs use on Database sessions without opening a backend
          # session directly or executing anything.
          CHECK_DIR="${{ steps.strings.outputs.build-output-dir }}/dev-headers-check"
          cat > "$CHECK_DIR/link-smoke.cpp" <<'EOF'
          #include <mantisbase/core/database.h>
          #include <soci/soci.h>
          int main() {
              soci::session sql; // unconnected; linked, never executed
              int v = 0;
              sql << "SELECT COUNT(*) FROM t", soci::into(v);
              sql << "INSERT INTO t(id) VALUES(:v)", soci::use(v);
              soci::row r;
              soci::statement st = (sql.prepare << "SELECT id FROM t", soci::into(r));
              st.execute();
              (void)st;
              soci::transaction tr(sql);
              (void)tr;
              soci::values vals;
              vals.set("k", 1);
              mb::MantisLoggerImpl logger;
              (void)logger;
              return 0;
          }
          EOF
          g++ -std=c++20 "$CHECK_DIR/link-smoke.cpp" -I"$CHECK_DIR/include" \
            -L"${{ steps.strings.outputs.build-output-dir }}/lib" -lmantisbase \
            -lpq -luuid -ldl -lpthread -lm -o "$CHECK_DIR/link-smoke"

      - name: Check dev headers (Windows)
        if: matrix.lib_platform == 'windows'
        shell: pwsh
        run: |
          # Validate the coalescing rules on Windows (compile check runs on Linux).
          cmake --install "${{ steps.strings.outputs.build-output-dir }}" --component mb-dev-headers --prefix "${{ steps.strings.outputs.build-output-dir }}/dev-headers-check"
          if (-not (Test-Path "${{ steps.strings.outputs.build-output-dir }}/dev-headers-check/include/mantisbase/mantisbase.h")) { throw "coalesced tree missing mantisbase headers" }
          if (-not (Test-Path "${{ steps.strings.outputs.build-output-dir }}/dev-headers-check/include/soci/soci-config.h")) { throw "coalesced tree missing soci-config.h" }
          if (-not (Test-Path "${{ steps.strings.outputs.build-output-dir }}/dev-headers-check/include/wolfssl/options.h")) { throw "coalesced tree missing wolfssl options.h" }

      - name: Test
        # Disable running tests on arm until we firgure out ASAN issues there
        if: matrix.arch != 'aarch64'
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config Release --output-on-failure -VV

      - name: Zip the build output (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'linux'
        run: |
          cd ${{ github.workspace }}/build/bin
          rm -f mantisbase_tests
          STAGING="zip/staging"
          mkdir -p "$STAGING"
          cp mantisbase "$STAGING/"
          cp "${{ github.workspace }}/LICENSE" "$STAGING/"
          cp "${{ github.workspace }}/mantisbase.d.ts" "$STAGING/"
          cp "${{ github.workspace }}/.github/release/README-linux-binary.md" "$STAGING/README.md"
          mkdir -p zip
          (cd "$STAGING" && zip -r "../mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip" .)

      - name: Zip the build output (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'macos'
        run: |
          cd ${{ github.workspace }}/build/bin
          rm -f mantisbase_tests
          STAGING="zip/staging"
          mkdir -p "$STAGING"
          cp mantisbase "$STAGING/"
          cp "${{ github.workspace }}/LICENSE" "$STAGING/"
          cp "${{ github.workspace }}/mantisbase.d.ts" "$STAGING/"
          cp "${{ github.workspace }}/.github/release/README-macos-binary.md" "$STAGING/README.md"
          mkdir -p zip
          (cd "$STAGING" && zip -r "../mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip" .)

      - name: Zip the build output (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'windows'
        shell: pwsh
        run: |
          del "${{ steps.strings.outputs.build-output-dir }}\bin\mantisbase_tests.exe" -ErrorAction SilentlyContinue
          $BinPath = "${{ steps.strings.outputs.build-output-dir }}\bin"
          $Staging = "$BinPath\zip\staging"
          $ZipFile = "$BinPath\zip\mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip"

          New-Item -ItemType Directory -Force -Path $Staging | Out-Null
          Copy-Item "$BinPath\mantisbase.exe" -Destination $Staging
          Copy-Item "${{ github.workspace }}\LICENSE" -Destination $Staging
          Copy-Item "${{ github.workspace }}\mantisbase.d.ts" -Destination $Staging
          Copy-Item "${{ github.workspace }}\.github\release\README-windows-binary.md" -Destination "$Staging\README.md"
          Compress-Archive -Path "$Staging\*" -DestinationPath $ZipFile -Force

      - name: Upload platform binary artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip
          path: |
            ${{ github.workspace }}/build/bin/zip/mantisbase_${{ github.ref_name }}_${{ matrix.platform }}.zip

      - name: Stage library files (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'linux'
        shell: bash
        run: |
          # Dev packages ship shared libraries only (no static archives).
          # Layout: lib-staging/<os>/libs/<arch>/libmantisbase.so
          # (arch names: x86, arm — see matrix pkg_arch).
          STAGING="lib-staging/${{ matrix.lib_platform }}/libs/${{ matrix.pkg_arch }}"
          mkdir -p "${STAGING}"
          cp "${{ steps.strings.outputs.build-output-dir }}/lib/libmantisbase.so" \
            "${STAGING}/"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            mkdir -p lib-staging/generated-include/mantisbase
            cp "${{ steps.strings.outputs.build-output-dir }}/include/mantisbase/config.hpp" \
              lib-staging/generated-include/mantisbase/config.hpp
          fi

      - name: Upload library artifact (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}-lib
          path: lib-staging/

      - name: Stage dev headers (Linux)
        # One coalesced tree per platform (platform-generated headers such as
        # soci-config.h can differ per arch). package-dev.cmake consumes the
        # linux-x86_64 tree; the Python wheel jobs use their own platform's.
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'linux'
        shell: bash
        run: |
          cmake --install ${{ steps.strings.outputs.build-output-dir }} \
            --component mb-dev-headers --prefix headers-staging

      - name: Upload headers artifact (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}-headers
          path: headers-staging/

      - name: Stage library files (Windows)
        # Both arches merge into lib-staging/windows/libs/{x86,arm}.
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'windows'
        shell: pwsh
        run: |
          # Dev packages ship shared libraries only (no static archives).
          $Staging = "lib-staging\${{ matrix.lib_platform }}\libs\${{ matrix.pkg_arch }}"
          New-Item -ItemType Directory -Force -Path $Staging | Out-Null
          Copy-Item "build\bin\libmantisbase.dll" -Destination "$Staging\"
          Copy-Item "build\lib\libmantisbase.dll.a" -Destination "$Staging\"
          New-Item -ItemType Directory -Force -Path "lib-staging\generated-include\mantisbase" | Out-Null
          Copy-Item "build\include\mantisbase\config.hpp" -Destination "lib-staging\generated-include\mantisbase\"

      - name: Upload library artifact (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}-lib
          path: lib-staging\

      - name: Stage dev headers (Windows)
        # Per-arch trees (see Linux note). package-dev.cmake consumes the
        # windows-x86_64 tree (see release.yml); wheels use their own arch's.
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'windows'
        shell: pwsh
        run: |
          cmake --install "${{ steps.strings.outputs.build-output-dir }}" --component mb-dev-headers --prefix headers-staging

      - name: Upload headers artifact (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}-headers
          path: headers-staging\

      - name: Stage library files (macOS)
        # NOTE: the dev-package (cmake/package-dev.cmake) currently supports
        # linux + windows only — macOS dylibs are staged for the Python wheels.
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'macos'
        shell: bash
        run: |
          STAGING="lib-staging/macos/libs/${{ matrix.pkg_arch }}"
          mkdir -p "${STAGING}"
          cp "${{ steps.strings.outputs.build-output-dir }}/lib/libmantisbase.dylib" \
            "${STAGING}/"

      - name: Upload library artifact (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}-lib
          path: lib-staging/

      - name: Stage dev headers (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'macos'
        shell: bash
        run: |
          cmake --install ${{ steps.strings.outputs.build-output-dir }} \
            --component mb-dev-headers --prefix headers-staging

      - name: Upload headers artifact (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.lib_platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: mantisbase_${{ github.ref_name }}_${{ matrix.platform }}-headers
          path: headers-staging/

  scripting:
    name: Build with scripting (linux-x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev uuid-dev

      - name: Configure CMake
        run: |
          cmake -B build-scripting \
            -DCMAKE_BUILD_TYPE=Release \
            -DMB_BUILD_TESTS=ON \
            -DMB_SCRIPTING_ENABLED=ON \
            -DMB_BUILD_DOCS=OFF \
            -S ${{ github.workspace }}

      - name: Build
        run: cmake --build build-scripting --config Release

      - name: Test scripting integration
        working-directory: build-scripting
        run: ctest --build-config Release --output-on-failure -R Scripting -VV
