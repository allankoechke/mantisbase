name: Docker build and push

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g. v0.3.5 or 0.3.5)'
        required: true
        type: string
      image_name:
        description: 'Docker image name (default: mantisbase)'
        required: false
        type: string
        default: 'mantisbase'
      prerelease:
        description: 'Whether this is a pre-release (true/false)'
        required: false
        type: string
        default: 'false'
      channel:
        description: 'Pre-release channel (alpha, beta, rc)'
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set version (strip leading v)
        id: version
        run: |
          v="${{ inputs.version }}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: docker_tags
        run: |
          repo="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}"
          version="${{ steps.version.outputs.version }}"
          {
            echo "tags<<EOF"
            echo "${repo}:${version}"
            if [ "${{ inputs.prerelease }}" = "true" ] && [ -n "${{ inputs.channel }}" ]; then
              echo "${repo}:${{ inputs.channel }}"
            elif [ "${{ inputs.prerelease }}" != "true" ]; then
              echo "${repo}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          build-args: |
            MB_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
