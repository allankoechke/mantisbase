components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or mb_sk_ API key
      description: |
        JWT from login/refresh, or a long-lived API key prefixed with `mb_sk_`.
        Both use `Authorization: Bearer <token>`.

  parameters:
    EntityName:
      name: entity_name
      in: path
      required: true
      description: Auth-type entity name (not a system entity).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_]{1,64}$"
        example: users
    DynamicEntityName:
      name: entity_name
      in: path
      required: true
      description: Registered entity name.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_]{1,64}$"
        example: posts
    SchemaNameOrId:
      name: schema_name_or_id
      in: path
      required: true
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        example: google
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    AfterCursor:
      name: after
      in: query
      schema:
        type: string
      description: Cursor (`id` of the last item from the previous page).
    Filter:
      name: filter
      in: query
      schema:
        type: string
      description: URL-encoded JSON object of `{field: value}` equality filters.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    ServiceUnavailable:
      description: Route temporarily disabled (e.g. env gate)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"

  schemas:
    ApiEnvelope:
      type: object
      properties:
        status:
          type: integer
        data:
          description: Payload; shape varies by endpoint.
        error:
          oneOf:
            - type: string
            - type: "null"
      required: [status, data, error]

    LoginRequest:
      type: object
      required: [identity, password]
      properties:
        identity:
          type: string
          description: Email address or user ID
          example: user@example.com
        password:
          type: string
          format: password

    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: "#/components/schemas/EntityRecord"
      required: [token, user]

    EntityRecord:
      type: object
      description: Dynamic record shape defined by entity schema.
      additionalProperties: true

    EntityListPage:
      type: object
      properties:
        items_count:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        cursor:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntityRecord"

    LogEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [trace, debug, info, warn, critical]
        origin:
          type: string
        message:
          type: string
        details:
          type: string
        created_at:
          type: string
          format: date-time

    LogListPage:
      type: object
      properties:
        items_count:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        cursor:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"

    ApiKeyCreateRequest:
      type: object
      properties:
        label:
          type: string
          default: API Key
          example: Mobile app
        permissions:
          type: array
          description: Stored metadata only; not enforced by middleware today.
          items: {}
          default: []
        expires_at:
          type: string
          description: Optional UTC expiration timestamp. Empty or omitted means no expiration.
          default: ""

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKeyMetadata"
        - type: object
          properties:
            key:
              type: string
              description: Raw secret shown once (`mb_sk_...`).
              example: mb_sk_a1b2c3d4...

    ApiKeyMetadata:
      type: object
      properties:
        id:
          type: string
        entity_name:
          type: string
        user_id:
          type: string
        label:
          type: string
        permissions:
          type: array
          items: {}
        last_used:
          type: string
          nullable: true
        created:
          type: string
        expires_at:
          type: string
          nullable: true

    AccessRule:
      type: object
      properties:
        mode:
          type: string
          enum: ["", public, auth, custom]
        expr:
          type: string

    EntitySchema:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [base, auth, view]
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: object
          properties:
            list:
              $ref: "#/components/schemas/AccessRule"
            get:
              $ref: "#/components/schemas/AccessRule"
            add:
              $ref: "#/components/schemas/AccessRule"
            update:
              $ref: "#/components/schemas/AccessRule"
            delete:
              $ref: "#/components/schemas/AccessRule"
        view_query:
          type: string
          description: Required for `view` entities.
      additionalProperties: true

    EntitySchemaCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_]{1,64}$"
        type:
          type: string
          enum: [base, auth, view]
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AccessRule"
        view_query:
          type: string

    EntitySchemaPatch:
      type: object
      properties:
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'Add by name, update by id, delete with op "delete".'
        rules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AccessRule"
        view_query:
          type: string

    AppSettings:
      type: object
      properties:
        orgName:
          type: string
          example: ACME Corp
        siteDomain:
          type: string
          format: uri
          description: Public site URL (OAuth callbacks, links, JWT audience)
        maxFileSize:
          type: integer
          description: Maximum upload size in bytes
          example: 10485760
        allowRegistration:
          type: boolean
        emailVerificationRequired:
          type: boolean
        sessionTimeout:
          type: integer
          description: Entity user session timeout in seconds
        adminSessionTimeout:
          type: integer
          description: Admin session timeout in seconds
        jwtEnableSetIssuer:
          type: boolean
        jwtEnableSetAudience:
          type: boolean
        smtp:
          $ref: "#/components/schemas/SmtpConfig"
        mantisVersion:
          type: string
          readOnly: true

    AppSettingsPatch:
      type: object
      description: Partial update; omitted fields retain current values.
      properties:
        orgName:
          type: string
        siteDomain:
          type: string
        maxFileSize:
          type: integer
          description: Maximum upload size in bytes
        allowRegistration:
          type: boolean
        emailVerificationRequired:
          type: boolean
        sessionTimeout:
          type: integer
        adminSessionTimeout:
          type: integer
        jwtEnableSetIssuer:
          type: boolean
        jwtEnableSetAudience:
          type: boolean
        smtp:
          $ref: "#/components/schemas/SmtpConfigPatch"

    SmtpConfig:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
          example: 587
        user:
          type: string
        password:
          type: string
          writeOnly: true
        from:
          type: string
        tls:
          type: boolean

    SmtpConfigPatch:
      type: object
      description: Partial SMTP update. Send `"********"` for password to keep the existing value.
      properties:
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        password:
          type: string
        from:
          type: string
        tls:
          type: boolean

    OAuthProvider:
      type: object
      additionalProperties: true

    OAuthProviderCreate:
      type: object
      required: [name, client_id, client_secret]
      properties:
        name:
          type: string
          example: google
        client_id:
          type: string
        client_secret:
          type: string
          format: password

    OAuthEntityConfig:
      type: object
      required: [entity_name, provider_id]
      properties:
        entity_name:
          type: string
        provider_id:
          type: string

    RealtimeSessionUpdate:
      type: object
      required: [client_id, topics]
      properties:
        client_id:
          type: string
          description: Session ID from the SSE `connected` event
        topics:
          type: array
          items:
            type: string
          description: Entity names or `entity:row_id` strings. Empty array clears subscriptions.

    RealtimeChangeEvent:
      type: object
      properties:
        action:
          type: string
          enum: [insert, update, delete]
        entity:
          type: string
        row_id:
          type: string
        topic:
          type: string
        timestamp:
          type: integer
